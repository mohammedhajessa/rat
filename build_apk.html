<!DOCTYPE html>
<html>
<head>
    <title>Build APK</title>
</head>
<body>
    <h2>Build APK for Phone</h2>
    <form action="http://192.168.1.101:9400/builder" method="POST">
        <label>Server IP:</label><br>
        <input type="text" name="uri" value="192.168.1.101" required><br><br>
        
        <label>Port:</label><br>
        <input type="text" name="port" value="9400" required><br><br>
        
        <button type="submit">Build APK</button>
    </form>
</body>
</html>
